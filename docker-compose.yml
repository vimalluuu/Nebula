version: '3.8'

services:
  # Backend API - Single source of truth for blockchain
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurement-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    volumes:
      # Persistent storage for vendor registrations
      - backend-storage:/app/storage
      # Shared blockchain data (in-memory but can be persisted)
      - blockchain-data:/app/blockchain-data
    networks:
      - procurement-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.procurement.service=backend"
      - "com.procurement.description=Blockchain API Server"

  # Frontend - Serves all portals (Public, Government, Vendor, Auditor)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: procurement-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=http://backend:5000/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - procurement-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.procurement.service=frontend"
      - "com.procurement.description=All Portals (Public, Government, Vendor, Auditor)"

networks:
  procurement-network:
    driver: bridge
    name: procurement-network
    labels:
      - "com.procurement.network=main"

volumes:
  # Persistent storage for vendor data
  backend-storage:
    driver: local
    name: procurement-storage
    labels:
      - "com.procurement.volume=storage"

  # Blockchain data persistence (optional - currently in-memory)
  blockchain-data:
    driver: local
    name: procurement-blockchain
    labels:
      - "com.procurement.volume=blockchain"

# Health check and monitoring
# All services are monitored via health checks
# Backend: Checks /api/health endpoint
# Frontend: Checks nginx is serving content
# Both services auto-restart on failure
